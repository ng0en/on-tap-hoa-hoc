<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn tập Hóa học THPT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- MÀN HÌNH 1: CHỌN CHƯƠNG -->
  <section id="screen-setup" class="screen">
    <header class="topbar">
      <h1>🧪 Ôn tập Hóa học THPT</h1>
    </header>

    <div class="card">
      <label class="field">
        <span>Họ và tên</span>
        <input id="inp-name" type="text" placeholder="Nhập tên của em..." autocomplete="name">
      </label>

      <label class="field">
        <span>Lớp</span>
        <select id="sel-grade"></select>
      </label>

      <label class="field">
        <span>Chương</span>
        <select id="sel-chapter"></select>
      </label>

      <div id="stats-box" class="stats-box hidden">
        <div class="stats-title">Tiến độ của em ở chương này</div>
        <div id="stats-content"></div>
      </div>

      <div class="field">
        <span>Số câu muốn làm</span>
        <div id="count-options" class="chip-row"></div>
      </div>

      <div class="field">
        <span>Chế độ chấm điểm</span>
        <div class="chip-row">
          <label class="chip-radio">
            <input type="radio" name="mode" value="hien_ngay" checked>
            <span>Hiện đúng/sai ngay sau mỗi câu</span>
          </label>
          <label class="chip-radio">
            <input type="radio" name="mode" value="hien_sau">
            <span>Hiện kết quả sau khi nộp bài</span>
          </label>
        </div>
      </div>

      <button id="btn-start" class="btn-primary" disabled>Bắt đầu làm bài</button>
      <div id="setup-msg" class="msg"></div>
    </div>
  </section>

  <!-- MÀN HÌNH 2: LÀM BÀI -->
  <section id="screen-quiz" class="screen hidden">
    <header class="topbar">
      <button id="btn-quit" class="btn-back">&larr; Thoát</button>
      <div id="quiz-progress" class="progress-text"></div>
    </header>
    <div class="progress-bar-wrap"><div id="progress-bar" class="progress-bar"></div></div>

    <div class="card" id="question-card">
      <div id="q-stem" class="q-stem"></div>
      <div id="q-options" class="q-options"></div>
      <div id="q-feedback" class="q-feedback hidden"></div>

      <div class="report-row">
        <button id="btn-report" type="button" class="btn-report-toggle">⚠️ Báo lỗi câu này</button>
        <span id="report-sent-msg" class="report-sent-msg hidden">Đã gửi, cảm ơn em!</span>
      </div>
      <div id="report-panel" class="report-panel hidden">
        <textarea id="report-note" rows="2" placeholder="Mô tả lỗi (không bắt buộc): sai đáp án, đề thiếu dữ kiện, lỗi chính tả..."></textarea>
        <div class="report-actions">
          <button id="btn-report-cancel" type="button" class="btn-mini btn-mini-secondary">Hủy</button>
          <button id="btn-report-send" type="button" class="btn-mini btn-mini-primary">Gửi báo lỗi</button>
        </div>
      </div>
    </div>

    <button id="btn-next" class="btn-primary" disabled>Câu tiếp theo</button>
  </section>

  <!-- MÀN HÌNH 3: KẾT QUẢ -->
  <section id="screen-result" class="screen hidden">
    <header class="topbar">
      <h1>Kết quả</h1>
    </header>
    <div class="card">
      <div id="result-score" class="result-score"></div>
      <div id="result-grid" class="result-grid"></div>
      <div id="result-stats" class="stats-box"></div>
      <button id="btn-retry-wrong" class="btn-primary btn-retry hidden"></button>
      <button id="btn-restart" class="btn-secondary">Làm lại / Chọn chương khác</button>
    </div>
  </section>

</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
